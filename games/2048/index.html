<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page page-narrow">
    <header class="topbar">
      <a class="btn" href="../../">← 大廳</a>
      <div class="stats">
        <div class="stat"><div class="stat-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <button class="btn" id="undo" type="button">↶ 復原</button>
      <select class="btn" id="mode" aria-label="模式">
        <option value="normal">一般</option>
        <option value="kids">小朋友</option>
      </select>
    </div>
    <p class="suggest" id="suggest" role="status" aria-live="polite" hidden></p>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="2048 棋盤"></div>
      <div class="overlay" id="overlay" hidden>
        <p class="overlay-title" id="overlay-title"></p>
        <div class="overlay-info" id="overlay-info"></div>
        <div class="overlay-actions" id="overlay-actions"></div>
      </div>
    </div>
    <p class="hint">方向鍵 / WASD · 手機滑動</p>
  </main>
  <dialog class="help confirm" id="quit-dlg" aria-labelledby="quit-title">
    <h2 class="help-title" id="quit-title">放棄這局?</h2>
    <p>會記為放棄、不給 XP。</p>
    <div class="confirm-actions">
      <button class="btn" type="button" data-act="quit">放棄並重開</button>
      <button class="btn" type="button" data-act="keep" autofocus>繼續玩</button>
    </div>
  </dialog>
  <script type="module" src="ui.js"></script>
</body>
</html>
