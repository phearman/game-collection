<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成語接龍 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css?v=c687ae3e">
  <link rel="stylesheet" href="style.css?v=c687ae3e">
</head>
<body>
  <main class="page page-narrow">
    <header class="topbar">
      <a class="btn" href="../../" aria-label="回到大廳" title="回到大廳"><span aria-hidden="true">←</span><span class="topbar-label">大廳</span></a>
      <div class="stats">
        <div class="stat"><div class="stat-label">時間</div><div class="stat-value" id="seconds">0 秒</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
    </div>
    <p id="progress-label"></p>
    <progress id="progress" max="10" value="0" aria-labelledby="progress-label"></progress>
    <section class="question-card" id="question" aria-label="接龍題目">
      <p class="chain-prompt">接「<strong id="tail"></strong>」開頭的成語</p>
      <div class="chain-current" id="current" aria-label="目前成語"></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="chain-cards" id="cards" aria-label="成語卡"></div>
      <div class="question-actions">
        <a id="lookup" class="btn" target="_blank" rel="noopener noreferrer" hidden>查看《成語典》</a>
        <button id="next" class="btn" type="button" hidden>下一步 →</button>
      </div>
    </section>
    <section class="result-card" id="result" aria-labelledby="result-title" hidden>
      <h1 id="result-title">🐉 接完 10 步!</h1>
      <div id="result-info" aria-live="polite"></div>
      <ol class="chain-list" id="chain-list" aria-label="本局接龍"></ol>
      <button class="btn" id="again" type="button">再玩一次</button>
    </section>
    <p class="hint">選第一個字和上一條最後一個字相同的成語</p>
  </main>
  <script type="module" src="ui.js?v=c687ae3e"></script>
</body>
</html>
