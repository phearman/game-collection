<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數獨 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css?v=359432a">
  <link rel="stylesheet" href="style.css?v=359432a">
</head>
<body>
  <main class="page page-narrow">
    <header class="topbar">
      <div class="navigation"><a class="btn" href="../../" aria-label="回到大廳" title="回到大廳"><span aria-hidden="true">←</span><span class="topbar-label">大廳</span></a></div>
      <div class="stats">
        <div class="stat"><div class="stat-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <a class="btn" id="daily" href="?daily=1">今日挑戰</a>
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <button class="btn" id="undo" type="button">↶ 復原</button>
      <label class="difficulty">難度
        <select id="difficulty"><option value="easy">入門 · 46</option><option value="normal">一般 · 40</option><option value="hard">困難 · 32</option><option value="expert">專家 · 26</option></select>
      </label>
    </div>
    <p class="daily-banner" id="daily-banner" role="status" hidden></p>
    <div class="assist-tools">
      <button class="btn" id="hint-button" type="button">💡 提示</button>
      <label><input id="auto-cand" type="checkbox"> 自動候選</label>
      <span id="assist-label" hidden>🧩 輔助局</span>
    </div>
    <div class="heading"><h1>數獨</h1><span>時間 <span id="time">0:00</span> · 提示 <span id="clues">40</span></span></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="board-wrap">
      <div class="board" id="board" role="group" aria-label="數獨棋盤" aria-describedby="hint"></div>
      <div class="overlay" id="overlay" hidden role="region" aria-labelledby="overlay-title" aria-live="polite">
        <p class="overlay-title" id="overlay-title">完成數獨！</p>
        <div class="overlay-info" id="overlay-info"></div>
        <button class="btn" id="again" type="button">確定 · 再玩一次</button>
      </div>
    </div>
    <div class="hint-message" id="hint-message" hidden>
      <p id="hint-text" role="status" aria-live="polite"></p>
      <div class="hint-actions">
        <button class="btn" id="hint-apply" type="button">填入答案</button>
        <button class="btn" id="hint-dismiss" type="button">知道了</button>
      </div>
    </div>
    <div class="number-pad" id="number-pad" role="group" aria-label="數字盤"></div>
    <div class="tools">
      <button class="btn" id="notes" type="button" aria-pressed="false">✎ 筆記：關</button>
      <button class="btn" id="clear" type="button">清除</button>
    </div>
    <p class="hint" id="hint">方向鍵選格 · 1–9 填入 · 0 / Backspace / Delete 清除<br>N 切換筆記 · Ctrl / ⌘ + Z 復原</p>
  </main>
  <dialog class="help confirm" id="assist-dlg" aria-labelledby="assist-title" aria-describedby="assist-text">
    <h2 class="help-title" id="assist-title">使用輔助?</h2>
    <p id="assist-text">使用提示後本局變成輔助局:不刷新最佳、XP 打對折。要繼續嗎?</p>
    <div class="confirm-actions">
      <button class="btn" type="button" data-act="assist">繼續</button>
      <button class="btn" type="button" data-act="cancel" autofocus>取消</button>
    </div>
  </dialog>
  <script type="module" src="ui.js?v=359432a"></script>
</body>
</html>
