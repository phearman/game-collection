<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>越野機車 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css?v=821ea37">
  <link rel="stylesheet" href="style.css?v=821ea37">
</head>
<body>
  <main class="page page-narrow page-fit">
    <header class="topbar">
      <a class="btn" href="../../" aria-label="回到大廳" title="回到大廳"><span aria-hidden="true">←</span><span class="topbar-label">大廳</span></a>
      <div class="stats">
        <div class="stat"><div class="stat-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="pause" type="button" aria-label="暫停" title="暫停(P)">⏸</button>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <select class="btn" id="mode" aria-label="模式">
        <option value="race">競速</option><option value="time">計時賽</option>
      </select>
      <select class="btn" id="difficulty" aria-label="難度">
        <option value="normal">一般</option><option value="hard">困難</option><option value="expert">專家</option>
      </select>
      <select class="btn" id="sensitivity" aria-label="操控靈敏度">
        <option value="low">靈敏低</option><option value="mid" selected>靈敏中</option><option value="high">靈敏高</option>
      </select>
    </div>
    <div class="stage-area">
      <div class="stage" id="stage">
        <canvas id="field" role="img" aria-label="四車道越野賽道"></canvas>
        <p class="sr-only" id="status" aria-live="polite"></p>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlay-title"></p>
          <div class="overlay-info" id="overlay-info"></div>
          <div class="overlay-actions" id="overlay-actions"></div>
        </div>
      </div>
    </div>
    <div class="controls" role="group" aria-label="機車操作">
      <button class="btn" data-control="left" type="button" aria-label="向左換道">◀</button>
      <button class="btn" data-control="right" type="button" aria-label="向右換道">▶</button>
      <button class="btn brake" data-control="brake" type="button">煞車</button>
      <button class="btn throttle" data-control="throttle" type="button">油門</button>
    </div>
    <p class="hint">↑ W 油門 · ↓ S 煞車 · ← → A D 換道 · P 暫停</p>
  </main>
  <script type="module" src="ui.js?v=821ea37"></script>
</body>
</html>
