<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下樓梯 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css?v=b19b96f">
  <link rel="stylesheet" href="style.css?v=b19b96f">
</head>
<body>
  <main class="page page-narrow page-fit">
    <header class="topbar">
      <a class="btn" href="../../" aria-label="回到大廳" title="回到大廳"><span aria-hidden="true">←</span><span class="topbar-label">大廳</span></a>
      <div class="stats">
        <div class="stat"><div class="stat-label" id="score-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="pause" type="button" aria-label="暫停" title="暫停(P)">⏸</button>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <select class="btn" id="mode" aria-label="模式">
        <option value="adventure">闖關</option>
        <option value="endless">無盡</option>
      </select>
      <select class="btn" id="difficulty" aria-label="難度">
        <option value="normal">普通</option>
        <option value="hard">困難</option>
        <option value="expert">專家</option>
      </select>
    </div>
    <div class="adventure-hud" id="adventure-hud" hidden>
      <strong id="stage-name"></strong>
      <div class="goal-bar" id="goal-bar" role="progressbar" aria-label="本關進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="goal-fill" id="goal-fill"></div><span class="goal-text" id="goal-progress"></span>
      </div>
      <span id="treasures"></span>
    </div>
    <div class="stage-area">
      <div class="stage" id="stage">
        <canvas id="field" role="img" aria-label="下樓梯場地"></canvas>
        <button class="btn cloud-off" id="cloud-off" type="button" hidden>☁ 下雲</button>
        <p class="sr-only" id="status" aria-live="polite"></p>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlay-title"></p>
          <div class="overlay-info" id="overlay-info"></div>
          <div class="overlay-actions" id="overlay-actions"></div>
        </div>
      </div>
    </div>
    <p class="hint">← → / A D 移動 · 手機按住左半邊/右半邊 · P 暫停</p>
  </main>
  <script type="module" src="ui.js?v=b19b96f"></script>
</body>
</html>
