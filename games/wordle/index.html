<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page page-narrow">
    <header class="topbar">
      <a class="btn" href="../../">← 大廳</a>
      <div class="stats">
        <div class="stat"><div class="stat-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <select class="btn" id="difficulty" aria-label="難度">
        <option value="normal">普通</option>
        <option value="hard">困難</option>
        <option value="assist">輔助</option>
      </select>
      <button class="btn" id="hint" type="button" hidden>💡 提示</button>
      <button class="btn" id="contrast" type="button" aria-pressed="false">◐ 高對比</button>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <section class="hints" id="hints" aria-label="提示" hidden>
      <div class="hint-buttons">
        <button class="btn" type="button" data-hint="letters">🔤 字母</button>
        <button class="btn" type="button" data-hint="sentence">📖 例句</button>
        <button class="btn" type="button" data-hint="candidates">🎯 候選</button>
      </div>
      <div class="hint-body" id="hint-body">
        <p class="hint-letters" id="hint-letters" hidden></p>
        <p class="hint-sentence" id="hint-sentence" hidden></p>
        <div class="hint-candidates" id="hint-candidates" hidden></div>
      </div>
    </section>
    <div class="board-wrap" id="board-wrap" tabindex="-1">
      <div class="board" id="board" role="grid" aria-label="Wordle 猜字格"></div>
      <div class="overlay" id="overlay" hidden>
        <p class="overlay-title" id="overlay-title"></p>
        <div class="overlay-info" id="overlay-info"></div>
        <div class="overlay-actions" id="overlay-actions"></div>
      </div>
    </div>
    <div class="keyboard" id="keyboard" aria-label="畫面鍵盤"></div>
  </main>
  <dialog class="help confirm" id="quit-dlg" aria-labelledby="quit-title">
    <h2 class="help-title" id="quit-title">放棄這局?</h2>
    <p>會記為放棄、不給 XP。</p>
    <p id="quit-best-note"></p>
    <div class="confirm-actions">
      <button class="btn" type="button" data-act="quit">放棄並重開</button>
      <button class="btn" type="button" data-act="keep" autofocus>繼續玩</button>
    </div>
  </dialog>
  <dialog class="help confirm" id="assist-dlg" aria-labelledby="assist-title">
    <h2 class="help-title" id="assist-title">使用提示?</h2>
    <p>使用提示後本局改為輔助局(不刷新最佳、XP 打對折),確定?</p>
    <div class="confirm-actions">
      <button class="btn" type="button" data-act="assist">確定使用提示</button>
      <button class="btn" type="button" data-act="keep" autofocus>先不要</button>
    </div>
  </dialog>
  <script type="module" src="ui.js"></script>
</body>
</html>
