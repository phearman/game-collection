<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>足球守門員 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css?v=09d8276">
  <link rel="stylesheet" href="style.css?v=09d8276">
</head>
<body>
  <main class="page page-narrow page-fit">
    <header class="topbar">
      <a class="btn" href="../../" aria-label="回到大廳" title="回到大廳"><span aria-hidden="true">←</span><span class="topbar-label">大廳</span></a>
      <div class="stats">
        <div class="stat"><div class="stat-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <button class="btn" id="pause" type="button">⏸ 暫停</button>
      <select class="btn" id="role" aria-label="角色">
        <option value="keeper">守門員</option>
        <option value="kicker">踢球員</option>
      </select>
      <select class="btn" id="difficulty" aria-label="難度">
        <option value="normal">簡單</option>
        <option value="hard">普通</option>
        <option value="expert">困難</option>
      </select>
      <select class="btn" id="shots" aria-label="球數"></select>
      <select class="btn" id="weather" aria-label="天氣">
        <option value="random">隨機天氣</option>
        <option value="sun">晴</option>
        <option value="rain">雨</option>
        <option value="snow">雪</option>
        <option value="night">夜</option>
        <option value="wind">風</option>
      </select>
    </div>
    <div class="board-area">
      <div class="board-wrap" id="board-wrap">
        <canvas class="field" id="field" aria-label="球場:上方球門與守門員,下方射手"></canvas>
        <div class="overlay" id="overlay" hidden>
          <p class="overlay-title" id="overlay-title"></p>
          <div class="overlay-info" id="overlay-info"></div>
          <div class="overlay-actions" id="overlay-actions"></div>
        </div>
      </div>
    </div>
    <p class="tally" id="tally" aria-live="polite"></p>
    <p class="pad-tip" id="keeper-tip">按住 ◀ ▶ 移動 · 也可以在球場上按住左右拖</p>
    <div class="pad" id="keeper-pad" role="group" aria-label="守門員動作">
      <button class="btn pad-btn pad-move" type="button" data-move="-1" aria-label="按住往左移動">◀</button>
      <button class="btn pad-btn" type="button" data-act="diveL">◀ 撲</button>
      <button class="btn pad-btn" type="button" data-act="jump">跳</button>
      <button class="btn pad-btn" type="button" data-act="diveR">撲 ▶</button>
      <button class="btn pad-btn pad-move" type="button" data-move="1" aria-label="按住往右移動">▶</button>
    </div>
    <div class="kicker-controls" id="kicker-controls" hidden>
      <div class="curves" role="group" aria-label="飛行弧度">
        <button class="btn curve-btn" id="curve-straight" type="button" aria-pressed="true">直球</button>
        <button class="btn curve-btn" id="curve-left" type="button" aria-pressed="false">左弧</button>
        <button class="btn curve-btn" id="curve-right" type="button" aria-pressed="false">右弧</button>
        <button class="btn curve-btn" id="curve-lob" type="button" aria-pressed="false">高吊</button>
      </div>
      <button class="btn shoot-btn" id="shoot" type="button">按住蓄力 · 放開射門</button>
    </div>
    <p class="hint" id="keeper-hint">按住 ← → / A D 移動 · ↑ / W 跳 · Z 左撲 · X 右撲 · 空白鍵開始 · P 暫停<br>手機:按住 ◀ ▶ 或在球場上左右拖移動 · 點上半跳 · 往左上/右上快滑撲</p>
    <p class="hint" id="kicker-hint" hidden>方向鍵移動準星 · 空白鍵開始／按住蓄力、放開射門 · P 暫停<br>點球門或拖曳準星瞄準 · 射門前選弧度</p>
  </main>
  <script type="module" src="ui.js?v=09d8276"></script>
</body>
</html>
