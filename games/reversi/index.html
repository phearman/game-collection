<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黑白棋 · 遊戲集錦</title>
  <link rel="stylesheet" href="../../shared/style.css?v=6d7df09">
  <link rel="stylesheet" href="style.css?v=6d7df09">
</head>
<body>
  <main class="page page-narrow">
    <header class="topbar">
      <div class="navigation"><a class="btn" href="../../" aria-label="回到大廳" title="回到大廳"><span aria-hidden="true">←</span><span class="topbar-label">大廳</span></a></div>
      <div class="stats">
        <div class="stat"><div class="stat-label">分數</div><div class="stat-value" id="score">0</div></div>
        <div class="stat"><div class="stat-label">最佳</div><div class="stat-value" id="best">0</div></div>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <div class="actions">
      <button class="btn" id="new" type="button">↻ 新遊戲</button>
      <button class="btn" id="undo" type="button">↶ 復原</button>
      <label>難度 <select id="difficulty"><option value="normal">新手</option><option value="hard">一般</option><option value="expert">高手</option></select></label>
      <label>先手 <select id="order"><option value="player">我先</option><option value="ai">AI 先</option><option value="alternate">輪流</option><option value="random">隨機</option></select></label>
      <button class="btn" id="hints" type="button" aria-pressed="true">提示：開</button>
    </div>
    <h1>黑白棋 <span id="color"></span></h1>
    <div class="readout"><span id="discs"></span><span id="status" role="status" aria-live="polite"></span></div>
    <div class="board-wrap">
      <div class="board" id="board" role="group" aria-label="黑白棋棋盤" aria-describedby="hint"></div>
      <div class="overlay" id="overlay" hidden role="region" aria-labelledby="overlay-title" aria-live="polite">
        <p class="overlay-title" id="overlay-title"></p>
        <div class="overlay-info" id="overlay-info"></div>
        <button class="btn" id="again" type="button">再玩一次</button>
      </div>
    </div>
    <p class="hint" id="hint">點格子 / 方向鍵移動 · Enter 或空白鍵落子</p>
  </main>
  <script type="module" src="ui.js?v=6d7df09"></script>
</body>
</html>
