<meta charset="utf-8">

<title>小集圖示組</title>
<style>
  :root { --ic-bg: #f6f5f1; --ic-text: #2c2c2a; --ic-sub: #5f5e5a; --ic-dark: #1c1c1b; --ic-dark-text: #f1efe8; --ic-dark-sub: #b4b2a9; color-scheme: light; }
  body { margin: 0; background: var(--ic-bg); color: var(--ic-text); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0; }
  p { color: var(--ic-sub); margin: 4px 0 12px; }
  section { border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .light { background: #ffffff; }
  .dark { background: var(--ic-dark); color: var(--ic-dark-text); }
  .dark small { color: var(--ic-dark-sub); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 0.9rem; margin-top: 4px; }
  small { display: block; color: var(--ic-sub); font-size: 0.75rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
</style>
</head>
