<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戲集錦</title>
  <link rel="stylesheet" href="shared/style.css?v=3f1141d">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1 class="brand">🎮 遊戲集錦</h1>
      <div class="topbar-actions">
        <a class="btn account-icon" id="account-link" href="me/" aria-label="帳號登入狀態" hidden></a>
        <a class="btn" id="me" href="me/">👤 我的</a>
        <button class="btn" id="theme" type="button" data-skin-toggle="on"></button>
      </div>
    </header>
    <p id="local-record-note" class="me-sub">未登入:紀錄只存在這台裝置</p>
    <section class="daily-card" aria-label="今日挑戰">
      <h2>📅 今日挑戰</h2>
      <p id="daily-message" role="status">登入後才能參加每日挑戰</p>
      <div id="daily-games" class="daily-games"></div>
    </section>
    <section class="cards" id="cards" aria-label="遊戲清單"></section>
    <section class="skin-compare" id="skin-compare" aria-labelledby="skin-compare-title" hidden>
      <h2 id="skin-compare-title">🎨 主題樣板比較</h2>
      <p>目前有 3 款美術風格可以試玩比較,套用在大廳、我的紀錄、2048、下樓梯。點一下就能切換(頂列的 🎨 也可以),深淺色鈕可再各試一次,挑到喜歡的請告訴我們。</p>
      <div class="skin-compare-list" id="skin-compare-list"></div>
    </section>
    <footer class="lobby-footer"><a href="changelog/">更新紀錄</a><span aria-hidden="true"> · </span><a href="privacy/">隱私權政策</a><span aria-hidden="true"> · </span><a id="feedback-link" href="me/">意見回饋</a><span aria-hidden="true"> · </span><a href="line/">LINE 小幫手使用說明</a></footer>
  </main>
  <script type="module">
    import { GAMES } from './shared/games.js?v=3f1141d';
    import { createProfile } from './shared/profile.js?v=3f1141d';
    import { LocalStore } from './shared/stores/local.js?v=3f1141d';
    import { bindThemeToggle } from './shared/theme.js?v=3f1141d';
    import { cloudEnabled } from './shared/supabase-config.js?v=3f1141d';
    import { hasPlayHistory, setupWhatsNew } from './shared/whats-new.js?v=3f1141d';
    import { mountDailyLobby } from './shared/daily.js?v=3f1141d';

    bindThemeToggle(document.getElementById('theme'));
    document.getElementById('feedback-link').addEventListener('click', async (event) => {
      event.preventDefault();
      const { openFeedback } = await import('./shared/feedback.js?v=3f1141d');
      await openFeedback();
    });

    const sum = await (await createProfile({ store: new LocalStore() })).summary();
    document.getElementById('me').textContent = `👤 我的 · Lv ${sum.level}`;

    // 最近活動在前(最後結算與存檔時間較新者,新到舊),其餘照 games.js 原順序。
    const byId = new Map(sum.games.map((g) => [g.id, g]));
    const games = sum.recent.map((id) => byId.get(id));
    const saves = new Set(sum.saves);

    const node = (tag, cls, text) => {
      const el = document.createElement(tag);
      el.className = cls;
      if (text !== undefined) el.textContent = text;
      return el;
    };
    for (const g of games) {
      const active = g.status === 'active';
      const best = g.stats?.best_score ?? 0;
      const card = node('a', `card${active ? ' is-active' : ''}`);
      card.href = `games/${g.id}/`;
      const head = node('div', 'card-head');
      const icon = node('span', 'card-icon', g.icon);
      icon.setAttribute('aria-hidden', 'true');
      const tags = node('span', 'card-tags');
      if (saves.has(g.id)) tags.append(node('span', 'tag is-resume', '繼續'));
      tags.append(node('span', `tag${active ? ' is-active' : ''}`, active ? '開發中' : '規劃中'));
      head.append(icon, tags);
      const title = node('p', 'card-title');
      if (g.code) title.append(node('span', 'card-code', `${g.code}${g.version ? ` v${g.version}` : ''}`));
      title.append(document.createTextNode(g.title));
      card.append(head, title, node('p', 'card-desc', g.desc));
      if (best) card.append(node('p', 'card-meta', `最佳 ${best.toLocaleString()}`));
      document.getElementById('cards').append(card);
    }
    setupWhatsNew({ hasHistory: hasPlayHistory(sum) });
    void mountDailyLobby(document).catch(() => {});
    if (cloudEnabled) {
      const { auth, notice } = await (await import('./shared/auth.js?v=3f1141d')).getCloudRuntime();
      const icon = document.getElementById('account-link');
      icon.hidden = false;
      const renderAccount = () => {
        document.getElementById('local-record-note').hidden = Boolean(auth.session);
        icon.textContent = auth.session ? '🟢' : '🔑';
        icon.setAttribute('aria-label', auth.session ? '已登入，前往帳號' : '未登入，前往帳號');
        icon.title = notice || (auth.session ? '已登入' : '用 Google 或 GitHub 登入');
      };
      renderAccount();
      auth.subscribe(renderAccount);
      if (notice) {
        const status = document.createElement('p');
        status.setAttribute('role', 'status');
        status.textContent = notice;
        document.querySelector('.topbar').after(status);
      }
    }
  </script>
  <script type="module" src="shared/skin-compare.js?v=3f1141d"></script>
</body>
</html>
