<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戲集錦</title>
  <link rel="stylesheet" href="shared/style.css?v=a9ad940">
  <!-- IR32/IR46:大廳模組一次並行下載,不必等上一層 import 解析完才發現下一層(原本要一層層往返)。
       清單 = 大廳靜態 import 全集 + 登入用的 auth.js;tests/lobby-preload.test.js 會比對,漏列或多列都會失敗。 -->
  <link rel="modulepreload" href="shared/games.js?v=a9ad940">
  <link rel="modulepreload" href="shared/profile-core.js?v=a9ad940">
  <link rel="modulepreload" href="shared/stores/local.js?v=a9ad940">
  <link rel="modulepreload" href="shared/progress.js?v=a9ad940">
  <link rel="modulepreload" href="shared/stores/errors.js?v=a9ad940">
  <link rel="modulepreload" href="shared/settle.js?v=a9ad940">
  <link rel="modulepreload" href="shared/cloud-status.js?v=a9ad940">
  <link rel="modulepreload" href="shared/supabase-config.js?v=a9ad940">
  <link rel="modulepreload" href="shared/theme.js?v=a9ad940">
  <link rel="modulepreload" href="shared/storage.js?v=a9ad940">
  <link rel="modulepreload" href="shared/sound.js?v=a9ad940">
  <link rel="modulepreload" href="shared/skin.js?v=a9ad940">
  <link rel="modulepreload" href="shared/whats-new.js?v=a9ad940">
  <link rel="modulepreload" href="shared/changelog.js?v=a9ad940">
  <link rel="modulepreload" href="shared/daily.js?v=a9ad940">
  <link rel="modulepreload" href="shared/lobby.js?v=a9ad940">
  <link rel="modulepreload" href="shared/duration.js?v=a9ad940">
  <link rel="modulepreload" href="shared/skin-compare.js?v=a9ad940">
  <link rel="modulepreload" href="shared/auth.js?v=a9ad940">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1 class="brand">🎮 遊戲集錦</h1>
      <div class="topbar-actions">
        <a class="btn account-icon" id="account-link" href="me/" aria-label="帳號登入狀態" hidden></a>
        <a class="btn" id="me" href="me/">👤 我的</a>
        <button class="btn" id="theme" type="button" data-skin-toggle="on"></button>
      </div>
    </header>
    <p id="local-record-note" class="me-sub">未登入:紀錄只存在這台裝置</p>
    <section class="daily-card" aria-label="今日挑戰">
      <h2>📅 今日挑戰</h2>
      <p id="daily-message" role="status">登入後才能參加每日挑戰</p>
      <p class="daily-note">遊戲固定、每天換題目</p>
      <div id="daily-games" class="daily-games"></div>
      <p class="daily-rank-link"><a href="daily-rank/">🏆 看今日排行</a></p>
    </section>
    <section class="lobby-section" id="featured" aria-labelledby="featured-title" hidden>
      <h2 class="lobby-heading" id="featured-title">⭐ 精選</h2>
      <div class="cards" id="featured-cards"></div>
    </section>
    <section class="lobby-section" id="pinned" aria-labelledby="pinned-title" hidden>
      <h2 class="lobby-heading" id="pinned-title">📌 我的釘選</h2>
      <div class="cards" id="pinned-cards"></div>
    </section>
    <section class="lobby-section" aria-labelledby="all-title">
      <h2 class="lobby-heading" id="all-title">全部遊戲</h2>
      <p class="pin-hint" id="pin-hint" hidden><span>點卡片右上角 📌 可以把常玩的放到最上面</span> <button class="btn" id="pin-hint-close" type="button">知道了</button></p>
      <div class="lobby-controls">
        <div class="category-tabs" id="category-tabs" role="group" aria-label="分類"></div>
        <label class="lobby-sort">排序 <select id="sort"></select></label>
      </div>
      <p class="pin-msg" id="pin-msg" role="status" aria-live="polite"></p>
      <div class="cards" id="cards" aria-label="遊戲清單"></div>
    </section>
    <section class="skin-compare" id="skin-compare" aria-labelledby="skin-compare-title" hidden>
      <h2 id="skin-compare-title">🎨 主題樣板比較</h2>
      <p>目前有 3 款美術風格可以試玩比較,套用在大廳、我的紀錄、2048、下樓梯。點一下就能切換(頂列的 🎨 也可以),深淺色鈕可再各試一次,挑到喜歡的請告訴我們。</p>
      <div class="skin-compare-list" id="skin-compare-list"></div>
    </section>
    <footer class="lobby-footer"><a href="changelog/">更新紀錄</a><span aria-hidden="true"> · </span><a href="privacy/">隱私權政策</a><span aria-hidden="true"> · </span><a id="feedback-link" href="me/">意見回饋</a><span aria-hidden="true"> · </span><a href="line/">LINE 小幫手使用說明</a></footer>
  </main>
  <script type="module">
    import { GAMES } from './shared/games.js?v=a9ad940';
    import { createProfile } from './shared/profile-core.js?v=a9ad940';
    import { LocalStore } from './shared/stores/local.js?v=a9ad940';
    import { bindThemeToggle } from './shared/theme.js?v=a9ad940';
    import { cloudEnabled } from './shared/supabase-config.js?v=a9ad940';
    import { hasPlayHistory, setupWhatsNew } from './shared/whats-new.js?v=a9ad940';
    import { mountDailyLobby } from './shared/daily.js?v=a9ad940';
    import { mountLobby } from './shared/lobby.js?v=a9ad940';

    bindThemeToggle(document.getElementById('theme'));
    document.getElementById('feedback-link').addEventListener('click', async (event) => {
      event.preventDefault();
      const { openFeedback } = await import('./shared/feedback.js?v=a9ad940');
      await openFeedback();
    });

    const sum = await (await createProfile({ store: new LocalStore() })).summary();
    document.getElementById('me').textContent = `👤 我的 · Lv ${sum.level}`;

    // RS38:精選、我的釘選、分類與排序(預設「最近玩過」= 現行 recentOrder);只存本機。
    mountLobby({ doc: document, games: sum.games, recent: sum.recent, saves: new Set(sum.saves), catalog: GAMES });
    setupWhatsNew({ hasHistory: hasPlayHistory(sum) });
    void mountDailyLobby(document).catch(() => {});
    if (cloudEnabled) {
      const { auth, notice } = await (await import('./shared/auth.js?v=a9ad940')).getCloudRuntime();
      const icon = document.getElementById('account-link');
      icon.hidden = false;
      const renderAccount = () => {
        document.getElementById('local-record-note').hidden = Boolean(auth.session);
        icon.textContent = auth.session ? '🟢' : '🔑';
        icon.setAttribute('aria-label', auth.session ? '已登入，前往帳號' : '未登入，前往帳號');
        icon.title = notice || (auth.session ? '已登入' : '用 Google 或 GitHub 登入');
      };
      renderAccount();
      auth.subscribe(renderAccount);
      if (notice) {
        const status = document.createElement('p');
        status.setAttribute('role', 'status');
        status.textContent = notice;
        document.querySelector('.topbar').after(status);
      }
    }
  </script>
  <script type="module" src="shared/skin-compare.js?v=a9ad940"></script>
</body>
</html>
