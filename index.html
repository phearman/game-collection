<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戲集錦</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1 class="brand">🎮 遊戲集錦</h1>
      <div class="topbar-actions">
        <a class="btn" id="me" href="me/">👤 我的</a>
        <button class="btn" id="theme" type="button"></button>
      </div>
    </header>
    <section class="cards" id="cards" aria-label="遊戲清單"></section>
  </main>
  <script type="module">
    import { GAMES } from './shared/games.js';
    import { createProfile } from './shared/profile.js';
    import { LocalStore } from './shared/stores/local.js';
    import { bindThemeToggle } from './shared/theme.js';

    bindThemeToggle(document.getElementById('theme'));

    const sum = await (await createProfile({ store: new LocalStore() })).summary();
    document.getElementById('me').textContent = `👤 我的 · Lv ${sum.level}`;

    // 最近活動在前(最後結算與存檔時間較新者,新到舊),其餘照 games.js 原順序。
    const byId = new Map(sum.games.map((g) => [g.id, g]));
    const games = sum.recent.map((id) => byId.get(id));
    const saves = new Set(sum.saves);

    document.getElementById('cards').innerHTML = games.map((g) => {
      const active = g.status === 'active';
      const best = g.stats?.best_score ?? 0;
      return `
        <a class="card${active ? ' is-active' : ''}" href="games/${g.id}/">
          <div class="card-head">
            <span class="card-icon" aria-hidden="true">${g.icon}</span>
            <span class="card-tags">
              ${saves.has(g.id) ? '<span class="tag is-resume">繼續</span>' : ''}
              <span class="tag${active ? ' is-active' : ''}">${active ? '開發中' : '規劃中'}</span>
            </span>
          </div>
          <p class="card-title">${g.title}</p>
          <p class="card-desc">${g.desc}</p>
          ${best ? `<p class="card-meta">最佳 ${best.toLocaleString()}</p>` : ''}
        </a>`;
    }).join('');
  </script>
</body>
</html>
